<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B8CDE"/>
      <stop offset="50%" style="stop-color:#9B7ECF"/>
      <stop offset="100%" style="stop-color:#8B6FC0"/>
    </linearGradient>
    <!-- Glass panel gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1"/>
    </linearGradient>
    <!-- Snowflake glow -->
    <radialGradient id="snowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60E0FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#60E0FF;stop-opacity:0"/>
    </radialGradient>
    <!-- Snowflake gradient -->
    <linearGradient id="snowColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40D4FF"/>
      <stop offset="50%" style="stop-color:#20C0F0"/>
      <stop offset="100%" style="stop-color:#00A0E0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Glass card -->
    <rect x="56" y="56" width="400" height="400" rx="70" ry="70" fill="url(#glass)" stroke="url(#glassBorder)" stroke-width="1.5"/>

    <!-- Inner circle (frosted ring) -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Snowflake glow behind -->
    <ellipse cx="256" cy="256" rx="100" ry="100" fill="url(#snowGlow)" filter="url(#blur)"/>

    <!-- Snowflake -->
    <g transform="translate(256, 256)" fill="none" stroke="url(#snowColor)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main arms -->
      <line x1="0" y1="-85" x2="0" y2="85"/>
      <line x1="-73.6" y1="-42.5" x2="73.6" y2="42.5"/>
      <line x1="-73.6" y1="42.5" x2="73.6" y2="-42.5"/>

      <!-- Branches: top -->
      <line x1="0" y1="-85" x2="-24" y2="-58"/>
      <line x1="0" y1="-85" x2="24" y2="-58"/>
      <!-- Branches: bottom -->
      <line x1="0" y1="85" x2="-24" y2="58"/>
      <line x1="0" y1="85" x2="24" y2="58"/>

      <!-- Branches: top-right -->
      <line x1="73.6" y1="-42.5" x2="46" y2="-52"/>
      <line x1="73.6" y1="-42.5" x2="63" y2="-15"/>
      <!-- Branches: bottom-left -->
      <line x1="-73.6" y1="42.5" x2="-46" y2="52"/>
      <line x1="-73.6" y1="42.5" x2="-63" y2="15"/>

      <!-- Branches: top-left -->
      <line x1="-73.6" y1="-42.5" x2="-63" y2="-15"/>
      <line x1="-73.6" y1="-42.5" x2="-46" y2="-52"/>
      <!-- Branches: bottom-right -->
      <line x1="73.6" y1="42.5" x2="63" y2="15"/>
      <line x1="73.6" y1="42.5" x2="46" y2="52"/>

      <!-- Center ring -->
      <circle cx="0" cy="0" r="12" fill="url(#snowColor)" stroke="none"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="url(#snowColor)" stroke-width="5"/>
    </g>
  </g>
</svg>